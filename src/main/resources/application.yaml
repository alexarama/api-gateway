server:
  port: 8085

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                - AddResponseHeader=X-Gateway-Source, api-gateway
            - id: event-service
              uri: lb://event-service
              predicates:
                - Path=/api/events/**
              filters:
                - AddResponseHeader=X-Gateway-Source, api-gateway
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
              filters:
                - AddResponseHeader=X-Gateway-Source, api-gateway
    config:
      uri: http://localhost:8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG