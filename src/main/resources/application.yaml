server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      servlet:
        routes:
          - id: user-service
            uri: lb://user-service
            predicates:
              - Path=/api/users/**
          - id: event-service
            uri: lb://event-service
            predicates:
              - Path=/api/events/**
          - id: notification-service
            uri: lb://notification-service
            predicates:
              - Path=/api/notifications/**
    config:
      uri: http://localhost:8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG